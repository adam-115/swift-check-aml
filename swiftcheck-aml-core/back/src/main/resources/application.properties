# Spring Boot configuration
spring.application.name=${SPRING_APPLICATION_NAME:swiftcheck-aml}
server.port=${SERVER_PORT:8087}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/swift_check_2?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:adam}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:adam}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Liquibase Configuration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=${SPRING_LIQUIBASE_ENABLED:true}

# JPA Configuration
# Le schéma est créé et modifié uniquement par Liquibase (db/changelog) : Hibernate n'y touche pas.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Reverse Proxy / Forwarded Headers (Caddy HTTPS)
server.forward-headers-strategy=framework

# Encoding Configuration
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# Ingestion des listes (voir le paquet com.swiftcheck.aml.ingestion)
# Fréquence de vérification des parsers à lancer, et délai avant la première vérification
swiftcheck.ingestion.check-interval=PT15M
swiftcheck.ingestion.initial-delay=PT2M
# Contrôles qualité : au-delà, la nouvelle version d'une liste n'est pas publiée
swiftcheck.quality.max-drop-percent=20
swiftcheck.quality.max-rejected-percent=1.0

# Test d'un parser (bouton « Tester ») : chaque élément du fichier source est cherché dans Yente
# PASSED si rien ne manque et si au moins ce pourcentage est retrouvé par le nom ; lots de noms par requête /match ; requêtes en parallèle
swiftcheck.test.min-match-percent=99
swiftcheck.test.batch-size=25
swiftcheck.test.threads=4

# Yente ne relit manifest.yml qu'au passage de sa tâche planifiée (YENTE_CRONTAB, chaque minute) :
# après l'ajout ou le retrait d'un dataset, la réindexation (/updatez) est demandée après ce délai
swiftcheck.yente.manifest-refresh-delay=PT90S

# PF4J Plugins Directory
pf4j.plugins.dir=${PF4J_PLUGINS_DIR:D:/test-parser/jar parser plugins}

# Keycloak OAuth2 Resource Server Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:https://si-legal-auth.duckdns.org/realms/swift-check-test}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:https://si-legal-auth.duckdns.org/realms/swift-check-test/protocol/openid-connect/certs}